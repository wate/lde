---
# code: language=ansible
- name: Setup post create task
  hosts: all
  connection: local
  become: false
  vars:
    ## Base Directory
    ## -------------
    base_dir: "{{ ansible_facts.env.PWD | dirname | dirname }}"
    ## Development Tools
    ## -------------
    install_tools:
      - eza
      - fd
      - bat
      - tig
      - tree
      - lnav
      - ripgrep
      - tgrep
      - lazygit
      - delta
      - goaccess
      - osv-scanner
      - direnv
      - task
      - restic
      - rclone
      - zns
      - jc
      - duckdb
      - assh
      - glow
      - bottom
      - pandoc
      - graphviz
      - d2
      - git-flow
      - tbls
      - runn
      - gitleaks
      - pict
      - zx
      - ni
      - mermaid-cli
      - fnt
      - lindera
      # - drawio
      - uv
      - rtk
      - context-mode
      - playwright-cli
    ## Markitdown
    ## -------------
    markitdown_install: false
    markitdown_options:
      ### Installs dependencies for PowerPoint files
      - pptx
      ### Installs dependencies for Word files
      - docx
      ### Installs dependencies for Excel files
      - xlsx
      ###  Installs dependencies for older Excel files
      # - xls
      ### Installs dependencies for PDF files
      - pdf
      ### Installs dependencies for Outlook messages
      # - outlook
      ### Installs dependencies for Azure Document Intelligence
      # - az-doc-intel
      ### Installs dependencies for audio transcription of wav and mp3 files
      # - audio-transcription
      ### Installs dependencies for fetching YouTube video transcription
      # - youtube-transcription
    ## Optional Skeleton Documents
    ## -------------
    expand_optional_docs: false
    optional_skeleton_files:
      # インフラ設計・運用設計
      - skel/docs/infrastructure_design.md
      - skel/docs/operation_design.md
      # 保守運用
      - skel/docs/server_operation.md
      - skel/docs/system_operation.md
      # セキュリティ運用
      - skel/docs/vulnerability_scan.md
      # 必要時に作る補助文書
      - skel/docs/code_metrics.md
      - skel/docs/glossary.md
  roles:
    - role: tools
      become: true
  tasks:
    - name: Install pip packages
      ansible.builtin.import_tasks:
        file: tasks/pip_package.yml
    - name: Set git setting
      ansible.builtin.import_tasks:
        file: tasks/git.yml
    - name: Set user environment setting
      ansible.builtin.import_tasks:
        file: tasks/environment.yml
    - name: Set bash-completion setting
      ansible.builtin.import_tasks:
        file: tasks/completion.yml
    - name: Find skeleton files
      ansible.builtin.find:
        paths:
          - skel
        hidden: true
        excludes:
          - .gitkeep
        recurse: true
      register: find_skeleton
    - name: Set optional skeleton target variable
      ansible.builtin.set_fact:
        excluded_skeleton_files: "{{ [] if (expand_optional_docs | bool) else optional_skeleton_files }}"
    - name: Set skeleton file variable
      ansible.builtin.set_fact:
        skeleton_files: "{{ (find_skeleton.files | map(attribute='path') | list) | difference(excluded_skeleton_files) }}"
    - name: Create directory
      ansible.builtin.file:
        path: "{{ base_dir }}/{{ dir_path }}"
        state: directory
        mode: "0755"
      loop: "{{ skeleton_files | map('dirname') | map('regex_replace', '^skel/?', '') | select() | unique }}"
      loop_control:
        loop_var: dir_path
        label: "{{ dir_path }}"
    - name: Copy skeleton files
      ansible.builtin.copy:
        src: "{{ skeleton_file }}"
        dest: "{{ base_dir }}/{{ skeleton_file | regex_replace('^skel/', '') }}"
        mode: "0644"
        force: false
        remote_src: true
      loop: "{{ skeleton_files }}"
      loop_control:
        loop_var: skeleton_file
        label: "{{ skeleton_file | regex_replace('^skel/', '') }}"
