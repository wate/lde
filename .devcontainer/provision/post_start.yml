---
# code: language=ansible
- name: Setup post start task
  hosts: all
  connection: local
  become: false
  vars:
    base_dir: "{{ ansible_facts.env.PWD | dirname | dirname }}"
  tasks:
    - name: Init task
      ansible.builtin.command:
        cmd: task --init
        creates: "{{ base_dir }}/Taskfile.yml"
        chdir: "{{ base_dir }}"
